<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Map [[${mapId}]]</title>
    <!--    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.7.0/ol.css">-->
    <link rel="stylesheet" th:href="@{/webjars/ol/ol.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/map.css}">
    <script th:src="@{/webjars/ol/dist/ol.js}" defer></script>
    <script th:src="@{/js/map.js}" defer></script>
</head>
<body>
<div id="map"></div>
<div class="controls">
    <div style="font-size:12px;color:#444;margin-bottom:6px">Notice: By using this site, you agree that any marker data
        you add will be stored on our server and may be visible to anyone with the map link.
        We do not collect personal data beyond what you choose to include in the marker and layer names.
    </div>
    <div class="link-row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;word-break:break-all">
        <div>Map id: <b th:text="${mapId}"></b></div>
        <button id="copy" class="icon-copy-btn" aria-label="Copy link" title="Copy link">
            <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18" fill="#333">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
            </svg>
            <span class="visually-hidden">Copy link</span>
        </button>
        <span id="copyStatusMap" class="copy-status">Link copied</span>
    </div>
    <div style="margin-top:6px">
        <input id="markerText" placeholder="Marker text"/>
        <select id="layerSelect"></select>
        <button id="addLayer">+ Layer</button>
    </div>
    <div id="layers"></div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const mapId = /*[[${mapId}]]*/ 'default';
    /*]]>*/
</script>
</body>
</html>
